# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
  commands:
    - pip install uv
    - cd kedro-datasets && uv pip install --system .[docs]
    - cd kedro-datasets && zensical build --clean
    # Publish the Zensical site to the Read the Docs output directory.
    - mkdir --parents $READTHEDOCS_OUTPUT/html
    - cp --recursive kedro-datasets/site/. $READTHEDOCS_OUTPUT/html
